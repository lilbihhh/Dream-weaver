services:
  web:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./:/app
      - dreamweaver-data:/data
    ports:
      - "3000:5000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command:
      - sh
      - -ec
      - |
        pip install --no-cache-dir -r requirements.txt &&
        exec flask --app app run --debug --host 0.0.0.0 --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: on-failure

volumes:
  dreamweaver-data:
